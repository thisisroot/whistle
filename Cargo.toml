[workspace]
resolver = "3"
members = ["crates/whistle-core", "crates/whistle-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
whistle-core = { path = "crates/whistle-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ureq = "3"
which = "7"
