<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="whistle info and install in a terminal">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; white-space: pre; }
    .p { fill: #3fb950; }
    .c { fill: #f0f6fc; font-weight: 600; }
    .h { fill: #f0f6fc; font-weight: 600; }
    .d { fill: #8b949e; }
    .u { fill: #39c5cf; font-weight: 600; }
    .v { fill: #a371f7; }
    .t { fill: #8b949e; font-size: 13px; }
  </style>
  <rect width="860" height="470" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="859" height="469" rx="12" fill="none" stroke="#30363d"/>
  <path d="M12.5 0.5h835a12 12 0 0 1 12 12v27.5h-859v-27.5a12 12 0 0 1 12-12z" fill="#161b22"/>
  <line x1="0.5" y1="40" x2="859.5" y2="40" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" class="t">whistle — Ubuntu 26.04</text>

  <text x="24" y="74"><tspan class="p">$</tspan> <tspan class="c">whistle info gimp</tspan></text>
  <text x="24" y="98" class="h">GIMP <tspan class="d">(org.gimp.GIMP)</tspan></text>
  <text x="24" y="120">GNU Image Manipulation Program</text>
  <text x="24" y="152">On Ubuntu 26.04 LTS:</text>
  <text x="24" y="174">  1. apt: gimp  <tspan class="u">&lt;- will use</tspan></text>
  <text x="24" y="196">  2. flatpak: org.gimp.GIMP  <tspan class="d">(flatpak is not installed)</tspan></text>

  <text x="24" y="238"><tspan class="p">$</tspan> <tspan class="c">whistle info notepad++</tspan></text>
  <text x="24" y="262" class="h">Notepad++ <tspan class="d">(org.notepad-plus-plus.NotepadPlusPlus)</tspan></text>
  <text x="24" y="284">Source code editor for Windows</text>
  <text x="24" y="316">On Ubuntu 26.04 LTS:</text>
  <text x="24" y="338">  1. wine: recipe org.notepad-plus-plus.NotepadPlusPlus <tspan class="v">(rev 1, verified)</tspan>  <tspan class="u">&lt;- will use</tspan></text>

  <text x="24" y="380"><tspan class="p">$</tspan> <tspan class="c">whistle install gimp --dry-run</tspan></text>
  <text x="24" y="404">Install GIMP with apt: gimp</text>
  <text x="24" y="426"><tspan class="d">would run:</tspan> sudo apt-get install -y gimp</text>
</svg>
