# Build static Linux binaries and the app store window's packages when a
# version tag (v1.2.3) is pushed, and publish them as a GitHub release.
# install.sh downloads the binaries from there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      ASSET: whistle-${{ matrix.arch }}-linux.tar.gz
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          mkdir -p dist/whistle
          cp "target/$TARGET/release/whistle" LICENSE README.md dist/whistle/
          dist/whistle/whistle --version
          tar -C dist -czf "$ASSET" whistle
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  # The app store window, as .deb, .rpm and AppImage.
  gui:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Build the AppImage without FUSE, which runners don't have.
      APPIMAGE_EXTRACT_AND_RUN: 1
      NO_STRIP: true
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/whistle-gui/ui/package-lock.json
      - run: npm ci
        working-directory: crates/whistle-gui/ui
      - uses: dtolnay/rust-toolchain@stable
      - run: npx --prefix ui tauri build --ci
        working-directory: crates/whistle-gui
      - name: Collect
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm \
            target/release/bundle/appimage/*.AppImage dist/
          ls -l dist
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [build, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum whistle-*.tar.gz *.deb *.rpm *.AppImage > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Whistle $GITHUB_REF_NAME" --generate-notes \
            whistle-*.tar.gz *.deb *.rpm *.AppImage SHA256SUMS
