# Format, lint and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # The recipe test parses every recipe in whistle-recipes.
      WHISTLE_RECIPES_DIR: ${{ github.workspace }}/whistle-recipes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: thisisroot/whistle-recipes
          path: whistle-recipes
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The app store window: its frontend, then the crate that serves it.
  gui:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: crates/whistle-gui/ui
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/whistle-gui/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p whistle-gui --all-targets -- -D warnings
