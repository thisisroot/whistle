# Format, lint and test on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # The recipe test parses every recipe in whistle-recipes.
      WHISTLE_RECIPES_DIR: ${{ github.workspace }}/whistle-recipes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: thisisroot/whistle-recipes
          path: whistle-recipes
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
